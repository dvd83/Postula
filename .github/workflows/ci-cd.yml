name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe du front
        run: |
          for f in web/*.js; do node --check "$f"; done

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typage des fonctions serveur
        working-directory: supabase/functions
        run: deno check ai/index.ts claim-free/index.ts

      - name: Aucun secret dans le dépôt
        run: |
          if grep -rEn "sk-ant-|service_role|SUPABASE_SERVICE_ROLE_KEY=|0x4AAAAAAA[A-Za-z0-9_-]{10,}" --include='*.js' --include='*.html' web; then
            echo "::error::Un secret semble présent dans le front."; exit 1
          fi

  deploy-backend:
    name: Déploiement Supabase
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: gnnslezorkjlpprmroiv
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ou SUPABASE_DB_PASSWORD manquant : déploiement Supabase ignoré."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: latest
      - name: Migrations de la base
        if: steps.guard.outputs.skip != 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Fonctions serveur
        if: steps.guard.outputs.skip != 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"

  deploy-frontend:
    name: Déploiement du site (Cloudflare Pages)
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets présents ?
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID manquant : déploiement du site ignoré."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cloudflare/wrangler-action@v3
        if: steps.guard.outputs.skip != 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=postula --branch=main
